<style>
#intro-splash{position:fixed;inset:0;z-index:99999;background:#fff;display:none;align-items:center;justify-content:center;overflow:hidden}
#intro-video{width:100%;height:100%;object-fit:contain;background:#fff}
#intro-skip{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));border:0;border-radius:20px;padding:10px 16px;background:#173e88;color:#fff;font:600 14px system-ui;cursor:pointer}
</style>
<div id="intro-splash" aria-label="SRII i-TRACK opening video">
<video id="intro-video" muted playsinline preload="none"><source src="./SRII_iTRACK_3sec_Portrait_Opening_Preview.mp4" type="video/mp4"></video>
<button id="intro-skip" type="button">Skip intro</button>
</div>
<script>
(function(){
 var splash=document.getElementById("intro-splash"),video=document.getElementById("intro-video");
 var key="srii-itrack-intro-shown-session-v1";
 // sessionStorage survives refresh and page navigation, but is cleared when
 // the browser/PWA session is actually terminated.
 var seen=false;
 try{seen=sessionStorage.getItem(key)==="1";if(!seen)sessionStorage.setItem(key,"1");}catch(e){}
 if(seen || (window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)){splash.remove();return;}
 var done=false;
 function dismiss(){if(done)return;done=true;video.pause();splash.remove();}
 splash.style.display="flex";
 document.getElementById("intro-skip").addEventListener("click",dismiss);
 video.addEventListener("ended",dismiss,{once:true});
 video.addEventListener("error",dismiss,{once:true});
 var timer=setTimeout(dismiss,3600);
 try{var p=video.play();if(p&&p.catch)p.catch(dismiss);}catch(e){dismiss();}
})();
</script>
