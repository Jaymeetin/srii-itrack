<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="SRII i-TRACK — San Remigio II District Document Tracking System">
<title>SRII i-TRACK · District Document Tracking System</title>
<link rel="icon" href="./assets/srii-itrack-icon-48.png" sizes="48x48" type="image/png">

<body>
<style>
@keyframes sriiIntroDismiss{0%,92%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;pointer-events:none}}
#intro-splash{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:sriiIntroDismiss 3.4s linear forwards}
#intro-video{width:100%;height:100%;object-fit:contain;background:#fff}
#intro-skip{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));border:0;border-radius:20px;padding:10px 16px;background:#173e88;color:#fff;font:600 14px system-ui;cursor:pointer}
@media(prefers-reduced-motion:reduce){#intro-splash{display:none}}
</style>
<div id="intro-splash" aria-label="SRII i-TRACK opening video">
<video id="intro-video" autoplay muted playsinline preload="metadata"><source src="./SRII_iTRACK_3sec_Portrait_Opening_Preview.mp4" type="video/mp4"></video>
<button id="intro-skip" type="button" onclick="document.getElementById('intro-splash').remove()">Skip intro</button>
</div>
<script>
(function(){
var splash=document.getElementById("intro-splash"),video=document.getElementById("intro-video");
function dismiss(){if(splash&&splash.isConnected)splash.remove();}
video.addEventListener("ended",dismiss,{once:true});
video.addEventListener("error",dismiss,{once:true});
var p=video.play();if(p&&p.catch)p.catch(dismiss);
setTimeout(dismiss,3600);
})();
</script>
<div id="app"><div class="startup"><a class="startup-logo-download" href="./assets/srii-itrack-official-logo.png" download="SRII-iTRACK-Official-Logo.png" title="Download the official SRII i-TRACK logo" aria-label="Download official SRII i-TRACK logo"><img class="brand-loader official-logo-image" src="./assets/srii-itrack-logo-optimized.webp" width="72" height="72" alt="SRII i-TRACK official logo"></a><h2>SRII i-TRACK</h2><p>Preparing your district workspace…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script src="./config.js" defer></script>
<script src="./app.js" defer></script>
<script src="./mobile-shell.js" defer></script>
<script src="./upload-ui.js" defer></script>
<script src="./download-ui.js" defer></script>
</body>
</html>
